<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finding Disney+ title…</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="resolve-page">
  <main class="resolve-card">
    <div class="logo" aria-hidden="true">D+</div>
    <h1>Finding your Disney+ title</h1>

    <button id="original" class="secondary">Open original regional link</button>
  </main>
  <script src="resolving.js"></script>
</body>
</html>
